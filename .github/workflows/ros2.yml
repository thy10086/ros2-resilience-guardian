name: ROS 2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.distro }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            distro: humble
          - os: ubuntu-24.04
            distro: jazzy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      - name: Install ROS package dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-yaml python3-venv python3-pip libseccomp2
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro "${{ matrix.distro }}" \
            -r -y

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/run_guardian.sh build \
            --distro "${{ matrix.distro }}" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          source "$GITHUB_WORKSPACE/install/${{ matrix.distro }}/setup.bash"
          python3 -m pytest tests

      - name: Run isolated research tests without silent skips
        shell: bash
        run: |
          set -euo pipefail
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          source "$GITHUB_WORKSPACE/install/${{ matrix.distro }}/setup.bash"
          python3 -m venv --system-site-packages output/agent-review-venv
          output/agent-review-venv/bin/python -m pip install \
            -r experiments/requirements-agent-review.txt \
            -r experiments/requirements-fuzzing.txt
          output/agent-review-venv/bin/python -c 'import langgraph, pyseccomp, hypothesis'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 output/agent-review-venv/bin/python -m pytest -q tests \
            --junitxml=output/research-tests.xml
          output/agent-review-venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('output/research-tests.xml').getroot()
          skipped = sum(int(s.attrib.get('skipped', '0')) for s in root.iter('testsuite'))
          if skipped:
              raise SystemExit(f'Research verification skipped {skipped} tests')
          PY
