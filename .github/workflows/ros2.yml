name: ROS 2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.distro }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            distro: humble
          - os: ubuntu-24.04
            distro: jazzy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      - name: Install ROS package dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-yaml
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src \
            --ignore-src \
            --rosdistro "${{ matrix.distro }}" \
            -r -y

      - name: Build workspace
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/run_guardian.sh build \
            --distro "${{ matrix.distro }}" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          source "$GITHUB_WORKSPACE/install/${{ matrix.distro }}/setup.bash"
          python3 -m pytest tests
